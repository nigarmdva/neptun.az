<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neptun Store</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="shortcut icon" href="./img/favicon-neptu-new.png" type="image/x-icon" />
  <link rel="stylesheet" href="slider.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    .install-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .install-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      position: relative;
      text-align: center;
      width: 300px;
    }

    .install-content h4 {
      margin-bottom: 15px;
    }

    .install-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 22px;
      cursor: pointer;
    }

    #miniInstallBtn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #ffc107;
      border: none;
      border-radius: 50%;
      padding: 12px 16px;
      font-size: 18px;
      cursor: pointer;
      z-index: 9998;
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js?v=6');
      });
    }

    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installModal').style.display = 'flex';
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(({ outcome }) => {
          if (outcome === 'accepted') {
            console.log('User accepted install');
          } else {
            console.log('User dismissed install');
          }
          deferredPrompt = null;
          document.getElementById('installModal').style.display = 'none';
          document.getElementById('miniInstallBtn').style.display = 'none';
        });
      }
    }

    function closeInstallModal() {
      document.getElementById('installModal').style.display = 'none';
      document.getElementById('miniInstallBtn').style.display = 'block';
    }

    function showInstallModal() {
      document.getElementById('installModal').style.display = 'flex';
      document.getElementById('miniInstallBtn').style.display = 'none';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.forEach(function (tooltipTriggerEl) {
        new bootstrap.Tooltip(tooltipTriggerEl);
      });
    });
  </script>
  
</head>
<body>
  <div id="root"></div>

  <div class="install-modal" id="installModal" style="z-index: 999999999999999999;">
    <div class="install-content">
      <span class="install-close" onclick="closeInstallModal()">×</span>
      <h4>📲 Neptun App</h4>
      <p>Tətbiqi quraşdırmaq istəyirsən?</p>
      <button class="btn" style="background-color:#fd7e14; color: antiquewhite;" onclick="installApp()">Yüklə</button>
    </div>
  </div>
  <button id="miniInstallBtn" class="btn" style="background-color: #fd7e14;" 
  onclick="showInstallModal()" 
  data-bs-toggle="tooltip" data-bs-placement="left" title="Tətbiqi Endir">
<i style="color: antiquewhite;" class="fa-solid fa-download"></i>
</button>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
